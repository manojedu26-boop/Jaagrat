<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Outer Shield Ring -->
  <path d="M256 64 L416 128 V272 C416 368 256 448 256 448 C256 448 96 368 96 272 V128 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Stylized Hindi Word जाग्रत -->
  <text x="256" y="275" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="96" fill="#FF5722" text-anchor="middle" letter-spacing="2">
    जाग्रत
  </text>
  
  <!-- Subtitle -->
  <text x="256" y="335" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="28" fill="#F8FAFC" text-anchor="middle" letter-spacing="6">
    JAAGRAT
  </text>
  
  <!-- Radar Eye Accent -->
  <circle cx="256" cy="170" r="14" fill="#22C55E" />
  <circle cx="256" cy="170" r="28" fill="none" stroke="#22C55E" stroke-width="4" stroke-dasharray="6,4" />
</svg>
