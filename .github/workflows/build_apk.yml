name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Jaagrat Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Platform Files
        run: |
          cp pubspec.yaml /tmp/pubspec_custom.yaml
          mkdir -p /tmp/backup_android
          cp android/app/src/main/AndroidManifest.xml /tmp/backup_android/AndroidManifest.xml
          flutter create --overwrite --project-name jaagrat --platforms=android --org com.jaagrat .
          cp /tmp/pubspec_custom.yaml pubspec.yaml
          cp /tmp/backup_android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          # Ensure minSdk is explicitly 21 for ML Kit Face Mesh and Firebase compatibility
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: flutter analyze || true

      - name: Build Android Release APK
        run: |
          set +e
          flutter build apk --release --no-tree-shake-icons -v > build.log 2>&1
          BUILD_EXIT=$?
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "## ❌ Android Build Failed (Exit Code: $BUILD_EXIT)" >> $GITHUB_STEP_SUMMARY
            echo "### Last 150 Lines of Build Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 150 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $BUILD_EXIT
          else
            echo "## ✅ Android Release APK Generated Successfully!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Verify APK Generation
        run: ls -la build/app/outputs/flutter-apk/

      - name: Upload Jaagrat APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaagrat-driver-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: build.log
