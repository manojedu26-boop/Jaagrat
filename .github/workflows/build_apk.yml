name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Jaagrat Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Platform Files
        run: |
          cp pubspec.yaml /tmp/pubspec_custom.yaml
          mkdir -p /tmp/backup_android
          cp android/app/src/main/AndroidManifest.xml /tmp/backup_android/AndroidManifest.xml
          flutter create --overwrite --project-name jaagrat --platforms=android --org com.jaagrat .
          cp /tmp/pubspec_custom.yaml pubspec.yaml
          cp /tmp/backup_android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Configure Android Build & MinSdk
        run: |
          # Ensure minSdk is 21 and multiDex is enabled for ML Kit & Firebase
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = .*/minSdk = 21/g' android/app/build.gradle.kts || true
            sed -i 's/minSdkVersion = .*/minSdkVersion = 21/g' android/app/build.gradle.kts || true
            sed -i '/defaultConfig {/a \        multiDexEnabled = true' android/app/build.gradle.kts || true
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
            sed -i '/defaultConfig {/a \        multiDexEnabled true' android/app/build.gradle || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: flutter analyze || true

      - name: Build Android Release APK
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Jaagrat APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaagrat-driver-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
