name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Jaagrat Release APK
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Platform Files
        run: |
          cp pubspec.yaml /tmp/pubspec_custom.yaml
          mkdir -p /tmp/backup_android
          cp android/app/src/main/AndroidManifest.xml /tmp/backup_android/AndroidManifest.xml
          flutter create --overwrite --project-name jaagrat --platforms=android --org com.jaagrat .
          cp /tmp/pubspec_custom.yaml pubspec.yaml
          cp /tmp/backup_android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          # Ensure minSdk is explicitly 21 for ML Kit Face Mesh and Firebase compatibility
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: flutter analyze || true

      - name: Build Android Release APK
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build.log

      - name: Publish Diagnostics to Step Summary
        if: always()
        run: |
          if [ -f build.log ]; then
            echo "## 📋 Android Build Diagnostics" >> $GITHUB_STEP_SUMMARY
            echo "### Extracted Failures & Errors:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "FAILURE:|error:|exception|Caused by:" -C 2 build.log | head -n 80 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "### Last 100 Lines of Build Log:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Verify APK Generation
        run: ls -la build/app/outputs/flutter-apk/

      - name: Upload Jaagrat APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaagrat-driver-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: build.log

      - name: Post Diagnostics to Commit Comment
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f build.log ]; then
            FAIL_LOG=$(tail -n 60 build.log)
            ERRORS=$(grep -E "FAILURE:|error:|exception|Caused by:" -C 2 build.log | head -n 40 || true)
            COMMENT_BODY=$(jq -n \
              --arg errors "$ERRORS" \
              --arg tail "$FAIL_LOG" \
              '{body: "### ❌ Build Diagnostics Report\n\n**Extracted Errors:**\n```text\n\($errors)\n```\n\n**Log Tail:**\n```text\n\($tail)\n```"}')
            curl -s -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
              -d "$COMMENT_BODY"
          fi
